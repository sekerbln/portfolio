<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkFlow — Dongjie Ma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=Open+Sans:wght@300..800&family=Noto+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ══════════ HEADER ══════════ */
    .p-header {
      max-width: 900px; margin: 0 auto;
      padding: 72px var(--page-px) 40px;
      text-align: center;
    }
    .p-meta { display: flex; justify-content: center; gap: 12px; font-size: 13px; color: var(--text-faint); margin-bottom: 20px; }
    .p-meta .p-meta-cat { color: var(--text); font-weight: 500; }
    .p-title {
      font-size: 48px; font-weight: 500; line-height: 1.15;
      letter-spacing: -.025em; color: var(--text);
    }

    /* ══════════ HERO ══════════ */
    .p-hero {
      max-width: 1100px; margin: 0 auto;
      padding: 0 var(--page-px);
    }
    .p-hero-media {
      aspect-ratio: 16 / 9;
      border-radius: 14px; overflow: hidden;
      background: #D7EDF8;
      display: flex; align-items: center; justify-content: center;
    }
    .p-hero-media img { height: 72%; object-fit: contain; }

    .p-byline {
      max-width: 1100px; margin: 0 auto;
      padding: 20px var(--page-px) 0;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; color: var(--text-muted);
    }
    .p-byline strong { color: var(--text); font-weight: 500; margin-right: 10px; }
    .p-share {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: none; cursor: pointer;
      font-family: 'Geist', sans-serif; font-size: 13px; color: var(--text-muted);
      padding: 6px 10px; border-radius: 6px; transition: background .15s, color .15s;
    }
    .p-share:hover { background: var(--gray-100); color: var(--text); }
    .p-share svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* ══════════ BODY LAYOUT ══════════ */
    .p-body {
      max-width: 1400px; margin: 0 auto;
      padding: 72px var(--page-px) 0;
      display: grid;
      grid-template-columns: 220px minmax(0, 680px) 220px;
      justify-content: space-between;
      column-gap: 40px;
    }

    /* 左侧目录 */
    .p-toc { position: sticky; top: 88px; align-self: start; }
    .p-toc-label { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 12px; }
    .p-toc ol { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .p-toc a { font-size: 13px; color: var(--text-faint); line-height: 1.4; transition: color .15s; }
    .p-toc a:hover { color: var(--text-muted); }
    .p-toc a.active { color: var(--text); }

    /* 正文 */
    .p-content { min-width: 0; grid-column: 2; }
    .p-content > section { scroll-margin-top: 88px; margin-bottom: 72px; }

    .p-content h2 {
      font-size: 26px; font-weight: 500; letter-spacing: -.015em;
      line-height: 1.3; color: var(--text); margin-bottom: 20px;
    }
    .p-content h3 {
      font-size: 18px; font-weight: 500; color: var(--text);
      margin: 36px 0 12px;
    }
    .p-content p {
      font-size: 17px; line-height: 1.75; color: var(--text);
      margin-bottom: 18px;
    }
    .p-content ul { margin: 0 0 18px 20px; }
    .p-content li { font-size: 17px; line-height: 1.75; margin-bottom: 6px; }

    .p-lead { font-size: 20px !important; line-height: 1.6 !important; }

    /* 占位文本：之后替换成真实内容 */
    .todo {
      background: #FFF6D6; border-radius: 4px; padding: 0 4px;
      color: #7A5B00;
    }

    /* ══════════ 加宽块（跳出正文栏） ══════════ */
    .p-wide {
      grid-column: 1 / -1;
      width: 100%; max-width: 1100px;
      margin: 0 auto 72px;
    }
    .p-wide-caption { font-size: 13px; color: var(--text-faint); margin-top: 12px; text-align: center; }

    /* 视频 */
    .p-video {
      aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden;
      background: #000;
    }
    .p-video iframe { width: 100%; height: 100%; border: 0; display: block; }

    /* 图片占位 */
    .p-media {
      aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden;
      background: var(--gray-100);
      display: flex; align-items: center; justify-content: center;
      color: var(--gray-400); font-size: 13px;
    }
    .p-media.tall { aspect-ratio: 4 / 3; }
    .p-media img { width: 100%; height: 100%; object-fit: cover; }

    /* 左右对比 */
    .p-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .p-compare-label { font-size: 12px; font-weight: 500; color: var(--text); margin-bottom: 10px; }

    /* 三个功能卡 */
    .p-features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .p-feature-media {
      aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden;
      background: #EAF4FB; margin-bottom: 14px;
      display: flex; align-items: center; justify-content: center;
      color: var(--gray-400); font-size: 13px;
    }
    .p-feature-title { font-size: 16px; font-weight: 500; margin-bottom: 6px; }
    .p-feature-text { font-size: 14px; line-height: 1.6; color: var(--text-muted); }

    /* 数据块 */
    .p-stats {
      display: grid; grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    }
    .p-stat { padding: 32px 24px; }
    .p-stat + .p-stat { border-left: 1px solid var(--border); }
    .p-stat-num { font-size: 40px; font-weight: 500; letter-spacing: -.02em; margin-bottom: 6px; }
    .p-stat-label { font-size: 14px; color: var(--text-muted); line-height: 1.5; }

    /* 引用 */
    .p-quote {
      font-family: 'Instrument Serif', serif;
      font-size: 30px; line-height: 1.35; letter-spacing: -.01em;
      color: var(--text); padding: 8px 0 8px 24px;
      border-left: 2px solid var(--text); margin: 32px 0;
    }

    /* 项目信息表 */
    .p-facts {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 20px 32px; padding: 28px 0;
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      margin: 8px 0 40px;
    }
    .p-fact-label { font-size: 12px; color: var(--text-faint); margin-bottom: 4px; }
    .p-fact-value { font-size: 15px; color: var(--text); line-height: 1.5; }

    /* ══════════ RELATED ══════════ */
    .p-related {
      max-width: 1600px; margin: 48px auto 0;
      padding: 64px var(--page-px) 96px;
      border-top: 1px solid var(--border);
    }
    .p-related-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .p-related-title { font-size: 24px; font-weight: 500; letter-spacing: -.01em; }
    .p-related-more { font-size: 14px; color: var(--text-muted); }
    .p-related-more:hover { color: var(--text); }
    .p-related-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .r-card:hover .r-thumb { opacity: .88; }
    .r-thumb {
      aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px; transition: opacity .2s; position: relative;
    }
    .r-title { font-size: 16px; font-weight: 500; margin-bottom: 6px; line-height: 1.4; }
    .r-meta { font-size: 13px; color: var(--text-faint); }

    /* ══════════ TABLET ══════════ */
    @media (max-width: 1199px) {
      .p-body { grid-template-columns: 200px minmax(0, 1fr); }
      .p-content { grid-column: 2; }
    }

    /* ══════════ MOBILE ══════════ */
    @media (max-width: 767px) {
      .p-header { padding: 48px var(--page-px) 28px; }
      .p-title { font-size: 32px; }
      .p-body { grid-template-columns: 1fr; padding-top: 40px; }
      .p-toc { display: none; }
      .p-content { grid-column: 1; }
      .p-content p, .p-content li { font-size: 16px; }
      .p-lead { font-size: 18px !important; }
      .p-compare, .p-features, .p-related-grid { grid-template-columns: 1fr; }
      .p-stats { grid-template-columns: 1fr; }
      .p-stat + .p-stat { border-left: none; border-top: 1px solid var(--border); }
      .p-facts { grid-template-columns: 1fr; }
      .p-quote { font-size: 24px; }
      .p-related { padding-bottom: 140px; }
    }

    /* ══════════ 用户画像 ══════════ */
    .p-personas { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .p-persona-img {
      aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden;
      background: var(--gray-100) center / cover no-repeat;
      margin-bottom: 14px;
    }
    .p-persona-name { font-size: 18px; font-weight: 500; margin-bottom: 4px; }
    .p-persona-meta { font-size: 13px; color: var(--text-faint); margin-bottom: 8px; }
    .p-persona-text { font-size: 15px; line-height: 1.6; color: var(--text-muted); }

    /* ══════════ 洞察列表 ══════════ */
    .p-insights { list-style: none !important; margin: 24px 0 0 !important; border-top: 1px solid var(--border); }
    .p-insights li {
      display: grid; grid-template-columns: 40px 1fr;
      padding: 16px 0; border-bottom: 1px solid var(--border); margin: 0 !important;
    }
    .p-insights li span:first-child { color: var(--text-faint); font-size: 14px; padding-top: 3px; }

    /* ══════════ 图片块（导出图片后自动显示，缺图时显示灰底） ══════════ */
    .p-img {
      aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden;
      background: var(--gray-100) center / cover no-repeat;
    }
    .p-img.contain { background-size: contain; background-color: #F4F9FD; }
    .p-img.phone { aspect-ratio: 390 / 844; background-size: cover; }
    .p-stack { display: flex; flex-direction: column; gap: 40px; }

    /* ══════════ 配色 ══════════ */
    .p-swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0 28px; }
    .p-swatches.six { grid-template-columns: repeat(6, 1fr); }
    .p-swatch-chip { aspect-ratio: 1 / 1; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 8px; }
    .p-swatches.six .p-swatch-chip { aspect-ratio: 1 / 1.2; }
    .p-swatch-name { font-size: 13px; font-weight: 500; }
    .p-swatch-hex { font-size: 12px; color: var(--text-faint); font-family: ui-monospace, monospace; }

    /* ══════════ 字体展示 ══════════ */
    .p-type {
      border: 1px solid var(--border); border-radius: 12px;
      padding: 28px; margin: 20px 0 8px;
      display: flex; justify-content: space-between; align-items: flex-end; gap: 24px;
    }
    .p-type-sample { font-size: 56px; line-height: 1; letter-spacing: -.02em; }
    .p-type-weights { font-size: 14px; color: var(--text-muted); text-align: right; line-height: 1.8; }

    /* ══════════ 迭代对比 ══════════ */
    .p-compare.phones { max-width: 760px; margin: 0 auto; gap: 40px; }

    @media (max-width: 767px) {
      .p-personas { grid-template-columns: 1fr; }
      .p-swatches.six { grid-template-columns: repeat(3, 1fr); }
      .p-type { flex-direction: column; align-items: flex-start; }
      .p-type-weights { text-align: left; }
      .p-compare.phones { grid-template-columns: 1fr 1fr; gap: 12px; }
    }

    /* ══════════ 功能卡片（与站内卡片同一风格） ══════════ */
    .fc-head { margin-bottom: 28px; }
    .fc-title { font-size: 24px; font-weight: 500; letter-spacing: -.01em; margin-bottom: 8px; }
    .fc-desc { font-size: 16px; line-height: 1.6; color: var(--text-muted); }
    .fc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .fc-card {
      display: block; text-align: left; background: none; border: none; padding: 0;
      font-family: 'Geist', sans-serif; color: var(--text); cursor: pointer;
    }
    .fc-thumb {
      aspect-ratio: 4 / 3; border-radius: 10px;
      background: var(--gray-100) center / cover no-repeat;
      margin-bottom: 16px; transition: opacity .2s;
    }
    .fc-card:hover .fc-thumb { opacity: .88; }

    /* 图框内：左上角图标 + 从右侧滑入的产品图 */
    .fc-thumb { position: relative; overflow: hidden; }
    .fc-icon {
      position: absolute; top: 16px; left: 16px; z-index: 2;
      width: 56px; height: 56px; border-radius: 14px;
      background: var(--white); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .fc-icon img { width: 100%; height: 100%; object-fit: cover; }
    .fc-product {
      position: absolute; right: 0; bottom: 0;
      height: 88%; width: auto; max-width: none;
      transform: translateX(100%);          /* 初始藏在图框右边外面 */
      will-change: transform;
    }
    @media (prefers-reduced-motion: reduce) {
      .fc-product { transform: none !important; }
    }
    .fc-name { font-size: 18px; font-weight: 500; margin-bottom: 6px; }
    .fc-meta { display: flex; gap: 10px; font-size: 13px; color: var(--text-faint); margin-bottom: 10px; }
    .fc-meta span:first-child { color: var(--text); font-weight: 500; }
    .fc-text { font-size: 14px; line-height: 1.6; color: var(--text-muted); margin-bottom: 14px; }
    .fc-link { font-size: 14px; color: var(--text); border-bottom: 1px solid var(--text); padding-bottom: 1px; }
    .fc-card:hover .fc-link { color: var(--text-muted); border-color: var(--text-muted); }

        /* ══════════ 功能流程弹窗 ══════════ */
    .fm-backdrop {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(13,13,13,.28);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center; padding: 24px;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .fm-backdrop.open { opacity: 1; pointer-events: auto; }
    .fm-card {
      width: min(1160px, 100%); max-height: calc(100vh - 48px); overflow-y: auto;
      background: var(--white); border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0,0,0,.12);
      transform: translateY(12px); transition: transform .25s;
    }
    .fm-backdrop.open .fm-card { transform: none; }

    .fm-top {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px 16px 28px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--white); z-index: 1;
    }
    .fm-tabs { display: flex; gap: 22px; flex-wrap: wrap; }
    .fm-tab {
      font-family: 'Geist', sans-serif; font-size: 15px; color: var(--text-faint);
      background: none; border: none; padding: 4px 0; cursor: pointer; transition: color .15s;
    }
    .fm-tab:hover { color: var(--text-muted); }
    .fm-tab.active { color: var(--text); font-weight: 500; }
    .fm-close, .fm-ctrl {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      border: 1px solid var(--border); background: var(--white); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: border-color .15s, opacity .15s;
    }
    .fm-close:hover, .fm-ctrl:hover { border-color: var(--text); }
    .fm-ctrl:disabled { opacity: .35; cursor: default; border-color: var(--border); }
    .fm-close svg, .fm-ctrl svg { width: 14px; height: 14px; fill: none; stroke: var(--text); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .fm-main { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 40px; padding: 32px 28px 28px; }
    .fm-title { font-size: 28px; font-weight: 500; letter-spacing: -.02em; margin-bottom: 12px; }
    .fm-scenario { font-size: 15px; line-height: 1.6; color: var(--text-muted); }
    .fm-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 24px; }
    .fm-head-text { min-width: 0; }
    .fm-icon {
      width: 56px; height: 56px; flex-shrink: 0; border-radius: 14px; overflow: hidden;
      background: var(--white); border: 1px solid var(--border);
    }
    .fm-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .fm-icon img[hidden], .fm-icon[hidden] { display: none; }
    .fm-label {
      display: inline-block; font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase;
      color: var(--text); border: 1px solid var(--border); border-radius: 20px; padding: 2px 9px; margin-right: 8px;
    }

    .fm-steps { list-style: none; border-top: 1px solid var(--border); }
    .fm-step {
      position: relative; display: grid; grid-template-columns: 28px 1fr; gap: 10px;
      width: 100%; text-align: left; background: none; border: none; cursor: pointer;
      font-family: 'Geist', sans-serif; font-size: 15px; line-height: 1.5; color: var(--text-faint);
      padding: 14px 0; border-bottom: 1px solid var(--border); transition: color .2s;
    }
    .fm-step:hover { color: var(--text-muted); }
    .fm-step-num { font-size: 13px; padding-top: 2px; }
    .fm-step.seen { color: var(--text-muted); }
    .fm-step.active { color: var(--text); }
    .fm-step.active .fm-step-num { font-weight: 500; }
    /* 当前步骤底部的进度线 */
    .fm-step::after {
      content: ""; position: absolute; left: 0; bottom: -1px; height: 1px; width: 0;
      background: var(--text);
    }
    .fm-step.active.playing::after { animation: fmProgress var(--fm-dur, 3500ms) linear forwards; }
    .fm-step.active:not(.playing)::after { width: 100%; }
    @keyframes fmProgress { from { width: 0; } to { width: 100%; } }

    .fm-result {
      font-size: 15px; line-height: 1.6; color: var(--text);
      background: var(--gray-50); border-radius: 10px; padding: 14px 16px; margin-top: 16px;
      display: none;
    }
    .fm-result.show { display: block; }
    .fm-controls { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
    .fm-replay {
      margin-left: 8px; background: none; border: none; cursor: pointer; padding: 0 0 1px;
      font-family: 'Geist', sans-serif; font-size: 14px; color: var(--text); border-bottom: 1px solid var(--text);
    }

    .fm-stage { min-width: 0; --fm-stage-bg: #F7F7F7; }   /* 素材区灰底，改这里 */

    /* 图片步骤 / 视频步骤 二选一显示 */
    .fm-device { display: none; }
    .fm-stage.is-video .fm-img { display: none; }
    .fm-stage.is-video .fm-device { display: flex; }

    .fm-device {
      height: min(560px, calc(100vh - 220px)); min-height: 320px;
      border-radius: 12px; background: var(--fm-stage-bg);
      align-items: center; justify-content: center; padding: 40px 0;
    }

    /* 设备区按自身尺寸缩放外框 */
    .fm-device { container-type: size; }
    .fm-device .tablet { display: none; }
    .fm-device.is-tablet .tablet { display: block; }
    .fm-device.is-tablet .iphone { display: none; }

    /* ── 白色平板外框（纯 CSS）──
       屏幕比例 2338 × 1872，边框 = 宽度的 3%；外框按设备区的宽高自动取较小值 */
    .tablet {
      position: relative;
      width: min(90cqw, calc(84cqh * 1.2305));
      padding: 3%;
      background: #FFFFFF;
      border-radius: 5% / 6.15%;
      box-shadow:
        0 0 0 1px #E3E3E0,
        inset 0 0 0 1px #F2F2F0,
        0 18px 40px rgba(0,0,0,.10);
    }
    .tablet-cam {
      position: absolute; top: 1.5%; left: 50%; transform: translate(-50%, -50%);
      width: .9%; aspect-ratio: 1; border-radius: 50%;
      background: #D6D6D3; box-shadow: inset 0 0 0 1px #C8C8C5;
    }
    .tablet-screen {
      position: relative; width: 100%; aspect-ratio: 2338 / 1872;
      border-radius: 2% / 2.5%; overflow: hidden; background: #111;
    }
    .tablet-screen video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tablet-screen .iphone-slide { object-fit: cover; }
    .tablet-screen.has-video .iphone-ph { display: none; }

    /* ── iPhone 13 Pro 外框（纯 CSS）──
       屏幕 390 × 844，机身边框按比例加宽，所有尺寸用百分比，随高度缩放 */
    .iphone {
      position: relative; height: 100%; aspect-ratio: 402 / 856;
      background: #0d0d0d;
      border-radius: 13.4% / 6.3%;
      padding: 1.5%;
      box-shadow:
        inset 0 0 0 1px #3a3a3a,
        0 16px 36px rgba(0,0,0,.14);
    }
    .iphone-screen {
      position: relative; width: 100%; height: 100%;
      border-radius: 12% / 5.6%; overflow: hidden; background: #000;
    }
    .iphone-screen video {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    /* 图片轮播步骤：两层图片叠在屏幕里，交叉淡入 */
    .iphone-slide {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; opacity: 0; transition: opacity .5s;
    }
    .iphone-slide.show { opacity: 1; }
    .iphone-screen.is-slides video { visibility: hidden; }
    /* 刘海 */
    .iphone-notch {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 39%; height: 3.6%;
      background: #0d0d0d;
      border-radius: 0 0 22% 22% / 0 0 60% 60%;
    }
    /* 没有视频时的占位文字 */
    .iphone-ph {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #6b6b6b; text-align: center; padding: 0 12%;
    }
    .iphone-screen.has-video .iphone-ph { display: none; }
    /* 侧边按键 */
    .iphone-btn { position: absolute; width: .7%; background: #2a2a2a; border-radius: 2px; }
    .iphone-btn-mute    { left: -.7%; top: 16%;   height: 3.6%; }
    .iphone-btn-volup   { left: -.7%; top: 23%;   height: 7%; }
    .iphone-btn-voldown { left: -.7%; top: 31.5%; height: 7%; }
    .iphone-btn-power   { right: -.7%; top: 25%;   height: 11%; }
    .fm-img {
      position: relative; height: min(560px, calc(100vh - 220px)); min-height: 320px;
      border-radius: 12px; background: var(--fm-stage-bg) center / contain no-repeat;
      background-origin: content-box;   /* 配合 padding，让图片缩在留白里面 */
      display: flex; align-items: center; justify-content: center;
      transition: opacity .25s;
    }
    .fm-img.fading { opacity: 0; }
    .fm-img-ph { font-size: 13px; color: var(--gray-400); }
    .fm-img.has-img .fm-img-ph { display: none; }

    body.fm-locked { overflow: hidden; }

    @media (prefers-reduced-motion: reduce) {
      .fm-backdrop, .fm-card, .fm-img { transition: none; }
      .fm-step.active.playing::after { animation: none; width: 100%; }
    }

    @media (max-width: 767px) {
      .fc-grid { grid-template-columns: 1fr; gap: 40px; }
      .fm-backdrop { padding: 0; align-items: flex-end; }
      .fm-card { border-radius: 16px 16px 0 0; max-height: 92vh; }
      .fm-top { padding: 12px 12px 12px 20px; }
      .fm-tabs { gap: 14px; }
      .fm-tab { font-size: 14px; }
      .fm-main { grid-template-columns: 1fr; gap: 20px; padding: 20px; }
      .fm-stage { order: -1; }
      .fm-img, .fm-device { height: 52vh; min-height: 300px; }
      .fm-title { font-size: 22px; }
    }


    .fm-current { display: none; }

    /* ══════════ 流程弹窗 · 手机端 ══════════
       一屏放下：标签栏 → 标题 → 素材（占满剩余高度）→ 分段进度条 → 当前步骤 → 按钮 */
    @media (max-width: 767px) {
      .fm-backdrop { padding: 0; align-items: flex-end; }
      .fm-card {
        height: 94vh; height: 94dvh; max-height: none;
        border-radius: 16px 16px 0 0; border-bottom: none;
        display: flex; flex-direction: column; overflow: hidden;
      }
      .fm-top { flex-shrink: 0; padding: 10px 10px 10px 16px; gap: 12px; }
      .fm-tabs {
        flex-wrap: nowrap; overflow-x: auto; gap: 18px;
        scrollbar-width: none; -webkit-overflow-scrolling: touch;
      }
      .fm-tabs::-webkit-scrollbar { display: none; }
      .fm-tab { white-space: nowrap; font-size: 14px; }

      .fm-main {
        flex: 1; min-height: 0;
        display: flex; flex-direction: column; gap: 14px;
        padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
      }
      .fm-side { display: contents; }          /* 让左栏里的元素直接参与排序 */

      .fm-head    { order: 1; margin-bottom: 0; gap: 12px; align-items: center; }
      .fm-stage   { order: 2; flex: 1; min-height: 180px; }
      .fm-steps   { order: 3; }
      .fm-current { order: 4; }
      .fm-result  { order: 5; margin-top: 0; }
      .fm-controls{ order: 6; margin-top: 0; }

      .fm-icon { width: 44px; height: 44px; border-radius: 11px; }
      .fm-title { font-size: 20px; margin-bottom: 4px; }
      .fm-scenario { font-size: 13px; line-height: 1.5;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .fm-label { padding: 1px 7px; font-size: 10px; }

      .fm-img, .fm-device { height: 100%; min-height: 0; }
      .fm-device { padding: 16px 0; }

      /* 步骤列表变成分段进度条 */
      .fm-steps { display: flex; gap: 4px; border-top: none; }
      .fm-steps li { flex: 1; }
      .fm-step {
        display: block; height: 3px; padding: 0; border: none; border-radius: 2px;
        background: var(--gray-200); font-size: 0; overflow: hidden;
      }
      .fm-step > span { display: none; }
      .fm-step.seen, .fm-step.active:not(.playing) { background: var(--text); }
      .fm-step::after { top: 0; bottom: 0; height: auto; }

      .fm-current { display: grid; grid-template-columns: 28px 1fr; gap: 8px;
        font-size: 15px; line-height: 1.5; color: var(--text); min-height: 45px; }
      .fm-current-num { font-size: 13px; color: var(--text-faint); padding-top: 2px; }

      .fm-result { padding: 10px 14px; font-size: 14px; }
      .fm-main.has-result .fm-current { display: none; }
      .fm-controls { justify-content: flex-start; }
    }


    /* ══════════ Touch & Go 界面分区讲解 ══════════ */
    .tg-explorer {
      display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr);
      gap: 40px; align-items: center;
    }
    .tg-list { list-style: none; border-top: 1px solid var(--border); }
    .tg-item {
      position: relative; display: grid; grid-template-columns: 32px 1fr; gap: 8px;
      width: 100%; text-align: start; background: none; border: none; cursor: pointer;
      padding: 18px 0; border-bottom: 1px solid var(--border);
      font-family: 'Geist', sans-serif; color: var(--text-faint); transition: color .2s;
    }
    .tg-item:hover { color: var(--text-muted); }
    .tg-item.active { color: var(--text); }
    .tg-item-num { font-size: 13px; padding-top: 3px; }
    .tg-item-title { display: block; font-size: 18px; font-weight: 500; }
    .tg-item-detail {
      display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s;
    }
    .tg-item-inner { overflow: hidden; min-height: 0; }
    .tg-item.active .tg-item-detail { grid-template-rows: 1fr; }
    .tg-item-text { display: block; font-size: 15px; line-height: 1.6; color: var(--text-muted); padding-top: 8px; }
    .tg-chips { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 12px; padding-bottom: 2px; }
    .tg-chips:empty { display: none; }
    .tg-chip {
      font-size: 12px; color: #3F7FBF; background: #EAF4FB;
      border-radius: 999px; padding: 3px 10px; white-space: nowrap;
    }
    /* 自动演示时的进度线 */
    .tg-item::after {
      content: ""; position: absolute; inset-inline-start: 0; bottom: -1px;
      height: 1px; width: 0; background: var(--text);
    }
    .tg-item.active::after { width: 100%; }
    .tg-item.active.playing::after { animation: fmProgress var(--tg-dur, 3500ms) linear forwards; }

    .tg-stage { background: #F7F7F7; border-radius: 12px; padding: 40px; min-width: 0; }
    .tg-tablet {
      position: relative; padding: 3%; background: #fff;
      border-radius: 5% / 6.15%;
      box-shadow: 0 0 0 1px #E3E3E0, inset 0 0 0 1px #F2F2F0, 0 18px 40px rgba(0,0,0,.10);
      direction: ltr;                              /* 截图本身不镜像 */
    }
    .tg-cam {
      position: absolute; top: 1.5%; left: 50%; transform: translate(-50%, -50%);
      width: .9%; aspect-ratio: 1; border-radius: 50%; background: #D6D6D3;
    }
    .tg-screen {
      position: relative; aspect-ratio: 2338 / 1872; overflow: hidden;
      border-radius: 2% / 2.5%;
      background: #D7EDF8 center / cover no-repeat;
    }
    .tg-ph {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: #6F9CC7;
    }
    .tg-screen.has-img .tg-ph { display: none; }
    .tg-video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; display: none;
    }
    .tg-screen.has-video .tg-video { display: block; }
    .tg-screen.has-video .tg-ph { display: none; }

    .tg-zone {
      position: absolute; padding: 0; border: none; cursor: pointer;
      background: transparent; transition: background .3s, box-shadow .3s;
    }
    .tg-screen.has-active .tg-zone { background: rgba(13,13,13,.42); }
    .tg-screen.has-active .tg-zone.active { background: transparent; box-shadow: inset 0 0 0 3px #5E9BD6; }
    .tg-zone-tag {
      position: absolute; top: 10px; right: 10px;
      font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 500; line-height: 1;
      color: #3F7FBF; background: #fff; border-radius: 999px; padding: 5px 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12); transition: background .3s, color .3s;
    }
    .tg-zone[data-zone="top"] .tg-zone-tag { top: 50%; transform: translateY(-50%); padding: 3px 7px; font-size: 11px; }
    .tg-zone.active .tg-zone-tag { background: #5E9BD6; color: #fff; }

    @media (prefers-reduced-motion: reduce) {
      .tg-zone, .tg-item-detail, .tg-zone-tag { transition: none; }
      .tg-item.active.playing::after { animation: none; width: 100%; }
    }
    @media (max-width: 767px) {
      .tg-explorer { grid-template-columns: 1fr; gap: 20px; }
      .tg-stage { order: -1; padding: 20px 12px; }
      .tg-zone-tag { top: 6px; right: 6px; font-size: 10px; padding: 3px 6px; }
      .tg-zone[data-zone="top"] .tg-zone-tag { padding: 1px 5px; font-size: 9px; }
      .tg-item-title { font-size: 16px; }
      .tg-item-text { font-size: 14px; }
    }


    /* ══════════════════ Steps 页面专属组件 ══════════════════ */
    .steps-hero { background: #FFFFFF; border: 1px solid var(--border); }
    .steps-hero img { height: 82%; }

    /* 通用：分段切换按钮 */
    .seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--gray-50); border: 1px solid var(--border); margin-bottom: 20px; max-width: 100%; }
    .seg-scroll { overflow-x: auto; scrollbar-width: none; }
    .seg-scroll::-webkit-scrollbar { display: none; }
    .seg-btn {
      display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
      font-family: 'Geist', sans-serif; font-size: 14px; color: var(--text-muted);
      background: none; border: none; cursor: pointer; padding: 8px 16px; border-radius: 999px;
      transition: background .2s, color .2s;
    }
    .seg-btn:hover { color: var(--text); }
    .seg-btn.active { background: var(--black); color: var(--white); }
    .seg-dot { width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; background: var(--gray-200); color: var(--text); }
    .seg-btn.active .seg-dot { background: var(--white); }

    /* 数字统计 */
    .st-stats { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .st-stat { padding: 40px 32px; }
    .st-stat + .st-stat { border-inline-start: 1px solid var(--border); }
    .st-num { font-size: 88px; font-weight: 500; letter-spacing: -.04em; line-height: 1; display: inline-block; }
    .st-unit { display: inline-block; font-size: 22px; margin-inline-start: 10px; color: var(--text-muted); }
    .st-label { font-size: 16px; line-height: 1.5; color: var(--text); margin-top: 14px; max-width: 360px; }
    .st-src { font-size: 12px; color: var(--text-faint); margin-top: 10px; }
    .st-pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px; }
    .st-pillar { border: 1px solid var(--border); border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 500; display: flex; flex-direction: column; gap: 22px; transition: background .2s, color .2s; }
    .st-pillar span { font-size: 12px; font-weight: 400; color: var(--text-faint); }
    .st-pillar:hover { background: var(--black); color: var(--white); }

    /* 用户画像 */
    .ps-card { border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
    .ps-panel { display: none; }
    .ps-panel.active { display: block; animation: stFade .35s ease; }
    @keyframes stFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .ps-id { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
    .ps-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--black); color: var(--white); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 500; flex-shrink: 0; }
    .ps-name { font-size: 26px; font-weight: 500; letter-spacing: -.01em; }
    .ps-meta { font-size: 15px; color: var(--text); }
    .ps-role { font-size: 13px; color: var(--text-faint); }
    .ps-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .ps-col { background: var(--gray-50); border-radius: 12px; padding: 20px; }
    .ps-label { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 10px; }
    .ps-col p, .ps-col li { font-size: 15px; line-height: 1.6; }
    .ps-col ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .ps-col li { padding-inline-start: 14px; position: relative; }
    .ps-col li::before { content: ""; position: absolute; inset-inline-start: 0; top: .65em; width: 5px; height: 5px; border-radius: 50%; background: var(--text); }

    /* 旅程地图 */
    .jm-panel { display: none; }
    .jm-panel.active { display: block; animation: stFade .35s ease; }
    .jm-scroll { overflow-x: auto; scrollbar-width: thin; border: 1px solid var(--border); border-radius: 16px; }
    .jm-grid { display: grid; grid-template-columns: 150px repeat(var(--n), minmax(190px, 1fr)); min-width: calc(150px + var(--n) * 190px); }
    .jm-head, .jm-cell { padding: 16px; font-size: 14px; line-height: 1.5; border-bottom: 1px solid var(--border); border-inline-start: 1px solid var(--border); }
    .jm-head { border-inline-start: none; font-size: 12px; font-weight: 500; color: var(--text-faint); background: var(--gray-50); }
    .jm-row-opp { border-bottom: none; }
    .jm-cell { color: var(--text-faint); transition: background .25s, color .25s; }
    button.jm-cell { font-family: 'Geist', sans-serif; text-align: start; background: none; border-top: none; border-inline-end: none; cursor: pointer; font-size: 15px; font-weight: 500; display: flex; flex-direction: column; gap: 6px; }
    .jm-num { font-size: 12px; font-weight: 400; color: var(--text-faint); }
    .jm-cell.on { color: var(--text); background: #FAFAFA; }
    .jm-cell.jm-row-stage.on { background: var(--black); color: var(--white); }
    .jm-cell.jm-row-stage.on .jm-num { color: rgba(255,255,255,.6); }
    .jm-cell.jm-row-pain.on { color: #B3261E; }
    .jm-cell.jm-row-opp.on { font-weight: 500; }
    .jm-sum { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    .jm-sum > div { border-radius: 12px; padding: 20px; background: var(--gray-50); }
    .jm-sum > div:last-child { background: var(--black); color: var(--white); }
    .jm-sum-h { font-size: 13px; font-weight: 500; margin-bottom: 10px; opacity: .7; }
    .jm-sum ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .jm-sum li { font-size: 15px; line-height: 1.55; padding-inline-start: 18px; position: relative; }
    .jm-sum li::before { content: "–"; position: absolute; inset-inline-start: 0; opacity: .5; }

    /* 需求 */
    .nd-list { list-style: none; border-top: 1px solid var(--border); margin: 8px 0 0 !important; }
    .nd-item { display: grid; grid-template-columns: 40px 1fr; padding: 20px 0; border-bottom: 1px solid var(--border); margin: 0 !important; }
    .nd-num { font-size: 13px; color: var(--text-faint); padding-top: 4px; }
    .nd-title { font-size: 18px; font-weight: 500; line-height: 1.4; margin-bottom: 6px; }
    .nd-ev { font-size: 15px; line-height: 1.6; color: var(--text-muted); }
    .nd-meter { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .nd-count { font-size: 28px; font-weight: 500; line-height: 1; }
    .nd-of { font-size: 13px; color: var(--text-faint); }
    .nd-dots { display: inline-flex; gap: 6px; margin-inline-start: 8px; }
    .nd-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--gray-100); transition: background .3s calc(var(--i) * 90ms), transform .3s calc(var(--i) * 90ms); }
    .nd-list.seen .nd-dot.on { background: var(--black); transform: scale(1.1); }

    /* 竞品 */
    .mk-card { border: 1px solid var(--border); border-radius: 16px; padding: 32px; margin-bottom: 40px; }
    .mk-panel { display: none; }
    .mk-panel.active { display: block; animation: stFade .35s ease; }
    .mk-name { font-size: 26px; font-weight: 500; margin-bottom: 20px; }
    .mk-sw { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .mk-s, .mk-w { border-radius: 12px; padding: 20px; }
    .mk-s { background: #EEF7EE; }
    .mk-w { background: #FBEFEE; }
    .mk-label { font-size: 12px; font-weight: 500; margin-bottom: 8px; }
    .mk-s .mk-label { color: #2E7D32; } .mk-w .mk-label { color: #B3261E; }
    .mk-s p, .mk-w p { font-size: 16px; line-height: 1.6; }
    .mk-sub { font-size: 20px; font-weight: 500; margin-bottom: 16px; }
    .mk-gaps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .mk-gap { border-top: 2px solid var(--text); padding-top: 16px; }
    .mk-gap-num { font-size: 12px; color: var(--text-faint); }
    .mk-gap-h { font-size: 16px; font-weight: 500; margin: 8px 0; }
    .mk-gap p { font-size: 14px; line-height: 1.6; color: var(--text-muted); }
    .mk-adv { background: var(--black); color: var(--white); border-radius: 16px; padding: 24px 28px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
    .mk-adv-h { font-size: 16px; font-weight: 500; }
    .mk-adv-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .mk-adv-chip { font-size: 14px; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 6px 14px; }

    /* 四张功能卡 */
    .fc-grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    /* 商业价值 */
    .bv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .bv-item { background: var(--gray-50); border-radius: 12px; padding: 20px; transition: transform .25s; }
    .bv-item:hover { transform: translateY(-4px); }
    .bv-num { font-size: 12px; color: var(--text-faint); }
    .bv-h { font-size: 16px; font-weight: 500; margin: 18px 0 8px; }
    .bv-item p { font-size: 14px; line-height: 1.6; color: var(--text-muted); }

    /* 方块地图 */
    .tm { position: relative; display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 48px; align-items: center; border: 1px solid var(--border); border-radius: 16px; padding: 40px; }
    .tm-stats { display: flex; flex-direction: column; gap: 20px; }
    .tm-ring { position: relative; width: 140px; height: 140px; }
    .tm-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .tm-ring circle { fill: none; stroke-width: 8; }
    .tm-ring-bg { stroke: var(--gray-100); }
    .tm-ring-fg { stroke: var(--black); stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
    .tm-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 500; }
    .tm-found, .tm-in { font-size: 15px; color: var(--text-muted); }
    .tm-big { font-size: 56px; font-weight: 500; letter-spacing: -.03em; line-height: 1.1; direction: ltr; text-align: start; }
    .tm-total { font-size: 22px; color: var(--text-faint); letter-spacing: 0; margin-inline-start: 4px; }
    .tm-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .tm-btn { font-family: 'Geist', sans-serif; font-size: 14px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--white); cursor: pointer; transition: opacity .15s, border-color .15s; }
    .tm-btn:hover { border-color: var(--text); }
    .tm-btn.solid { background: var(--black); color: var(--white); border-color: var(--black); }
    .tm-btn.solid:hover { opacity: .8; }
    .tm-sentence { font-size: 13px; line-height: 1.6; color: var(--text-faint); min-height: 2.6em; }
    .tm-grid { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(10, auto); gap: 5px; direction: ltr; max-width: 560px; margin-inline-start: auto; width: 100%; }
    .tm-tile {
      aspect-ratio: 1; border: none; border-radius: 6px; cursor: pointer;
      background: var(--gray-100); color: var(--text-faint);
      font-family: 'Geist', sans-serif; font-size: clamp(9px, 1.1vw, 12px); font-weight: 500;
      transition: background .2s, color .2s, transform .15s;
    }
    .tm-tile:hover { background: var(--gray-200); color: var(--text); transform: scale(1.06); }
    .tm-tile.on { background: var(--black); color: var(--white); }

    .tm-tile.pop { animation: tmPop .3s ease; }
    @keyframes tmPop { 50% { transform: scale(1.2); } }
    .tm-toast { position: absolute; left: 50%; bottom: 20px; transform: translate(-50%, 10px); background: var(--black); color: var(--white); font-size: 13px; padding: 8px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
    .tm-toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* 前后对比滑块 */
    .ba { max-width: 420px; margin: 0 auto; direction: ltr; }
    .ba-frame { position: relative; aspect-ratio: 440 / 956; border-radius: 28px; overflow: hidden; background: var(--gray-100); border: 6px solid #0d0d0d; box-shadow: 0 18px 40px rgba(0,0,0,.12); --pos: 50%; }
    .ba-img { position: absolute; inset: 0; background: center / cover no-repeat; display: flex; align-items: center; justify-content: center; }
    .ba-after { background-color: #F3F3F1; }
    .ba-before { background-color: #E4E4E1; clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
    .ba-ph { font-size: 13px; color: var(--text-faint); }
    .ba-before .ba-ph { transform: translateX(-30%); }
    .ba-after .ba-ph { transform: translateX(30%); }
    .ba-handle { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; background: #fff; transform: translateX(-1px); pointer-events: none; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
    .ba-handle span { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; transform: translate(-50%, -50%); border-radius: 50%; background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
    .ba-handle span::before, .ba-handle span::after { content: ""; position: absolute; top: 50%; width: 7px; height: 7px; border-top: 2px solid #0d0d0d; border-left: 2px solid #0d0d0d; }
    .ba-handle span::before { left: 9px; transform: translateY(-50%) rotate(-45deg); }
    .ba-handle span::after { right: 9px; transform: translateY(-50%) rotate(135deg); }
    .ba-range { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
    .ba-labels { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); margin-top: 12px; padding: 0 4px; }

    /* 路线图甘特图 */
    .rm-scroll { overflow-x: auto; }
    .rm-chart { min-width: 720px; }
    .rm-weeks, .rm-bars { display: grid; grid-template-columns: repeat(14, 1fr); }
    .rm-weeks { border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 12px; direction: ltr; }
    .rm-wk { font-size: 12px; color: var(--text-faint); text-align: center; }
    .rm-bars { row-gap: 8px; direction: ltr; }
    .rm-bars .rm-bar:nth-child(1) { grid-row: 1; } .rm-bars .rm-bar:nth-child(2) { grid-row: 2; } .rm-bars .rm-bar:nth-child(3) { grid-row: 3; }
    .rm-bars .rm-bar:nth-child(4) { grid-row: 4; } .rm-bars .rm-bar:nth-child(5) { grid-row: 5; }
    .rm-bar {
      display: flex; align-items: center; gap: 8px; min-width: 0;
      font-family: 'Geist', sans-serif; font-size: 13px; text-align: start; white-space: nowrap; overflow: hidden;
      border: none; border-radius: 8px; padding: 10px 12px; cursor: pointer;
      background: var(--gray-100); color: var(--text-muted); transition: background .2s, color .2s;
    }
    .rm-bar.open { background: repeating-linear-gradient(90deg, var(--gray-100) 0 70%, transparent 100%); }
    .rm-bar:hover { color: var(--text); }
    .rm-bar.active { background: var(--black); color: var(--white); }
    .rm-bar-n { font-size: 11px; opacity: .6; }
    .rm-bar-t { overflow: hidden; text-overflow: ellipsis; }
    .rm-detail { display: none; margin-top: 20px; border: 1px solid var(--border); border-radius: 16px; padding: 24px 28px; }
    .rm-detail.active { display: block; animation: stFade .35s ease; }
    .rm-detail-top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .rm-detail-n { font-size: 13px; color: var(--text-faint); }
    .rm-detail-h { font-size: 20px; font-weight: 500; }
    .rm-detail-t { font-size: 14px; color: var(--text-faint); }
    .rm-detail-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .rm-label { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 6px; }
    .rm-detail p { font-size: 15px; line-height: 1.6; }

    /* 产品待办 */
    .bl-chips { display: flex; gap: 8px; margin: 8px 0 16px; flex-wrap: wrap; }
    .bl-chip { font-family: 'Geist', sans-serif; font-size: 13px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--white); cursor: pointer; color: var(--text-muted); }
    .bl-chip.active { background: var(--black); color: var(--white); border-color: var(--black); }
    .bl-table { border-top: 1px solid var(--border); }
    .bl-row { display: grid; grid-template-columns: 1.1fr 90px 1.4fr; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--border); font-size: 15px; line-height: 1.5; align-items: start; transition: opacity .25s; }
    .bl-row.dim { opacity: .2; }
    .bl-headrow { font-size: 12px; color: var(--text-faint); }
    .bl-f { font-weight: 500; }
    .bl-j { color: var(--text-muted); }
    .bl-tag { font-size: 12px; padding: 2px 10px; border-radius: 999px; }
    .bl-high { background: var(--black); color: var(--white); }
    .bl-med { background: var(--gray-200); color: var(--text); }
    .bl-low { border: 1px solid var(--border); color: var(--text-muted); }

    /* 建议 */
    .rc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 8px 0 8px; }
    .rc-item { border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    .rc-num { font-size: 12px; color: var(--text-faint); }
    .rc-h { font-size: 17px; font-weight: 500; margin: 14px 0 4px; }
    .rc-e { font-size: 14px; color: var(--text-muted); }
    .rc-whys { border-top: 1px solid var(--border); }
    .rc-why { border-bottom: 1px solid var(--border); }
    .rc-why summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 0; font-size: 17px; font-weight: 500; }
    .rc-why summary::-webkit-details-marker { display: none; }
    .rc-plus { position: relative; width: 14px; height: 14px; flex-shrink: 0; }
    .rc-plus::before, .rc-plus::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1.5px; background: var(--text); transition: transform .25s; }
    .rc-plus::after { transform: rotate(90deg); }
    .rc-why[open] .rc-plus::after { transform: rotate(0); }
    .rc-why p { margin: 0 0 18px !important; color: var(--text-muted); }
    .st-quote { font-size: 32px; margin-top: 48px; }

    @media (prefers-reduced-motion: reduce) {
      .ps-panel.active, .jm-panel.active, .mk-panel.active, .rm-detail.active { animation: none; }
      .nd-dot, .tm-ring-fg, .tm-tile { transition: none; }
    }

    @media (max-width: 1199px) {
      .fc-grid.four, .bv-grid, .mk-gaps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tm { grid-template-columns: 1fr; }
      .tm-grid { margin-inline-start: 0; }
    }
    @media (max-width: 767px) {
      .st-stats { grid-template-columns: 1fr; }
      .st-stat + .st-stat { border-inline-start: none; border-top: 1px solid var(--border); }
      .st-stat { padding: 28px 4px; }
      .st-num { font-size: 64px; }
      .st-pillars { grid-template-columns: 1fr 1fr; }
      .ps-card, .mk-card { padding: 20px; }
      .ps-cols, .mk-sw, .jm-sum, .rm-detail-cols, .rc-grid { grid-template-columns: 1fr; gap: 12px; }
      .jm-grid { grid-template-columns: 110px repeat(var(--n), 170px); min-width: calc(110px + var(--n) * 170px); }
      .fc-grid.four, .bv-grid, .mk-gaps { grid-template-columns: 1fr; }
      .tm { padding: 20px; gap: 24px; }
      .tm-stats { display: grid; grid-template-columns: 100px 1fr; align-items: center; gap: 16px; }
      .tm-ring { width: 100px; height: 100px; }
      .tm-big { font-size: 40px; }
      .tm-actions, .tm-sentence { grid-column: 1 / -1; }
      .tm-grid { gap: 3px; }
      .tm-tile { border-radius: 4px; font-size: 8px; }
      .ba { max-width: 300px; }
      .bl-row { grid-template-columns: 1fr auto; }
      .bl-j { grid-column: 1 / -1; font-size: 14px; }
      .bl-headrow .bl-j, .bl-headrow > div:nth-child(3) { display: none; }
      .st-quote { font-size: 24px; }
    }


    /* ══════════════════ ZeitGuard 页面专属组件 ══════════════════ */
    :root { --zg-blue: #2F66D6; --zg-navy: #0B1A3A; --zg-red: #E5231B; --zg-green: #2FB36B; }
    .zg-hero { background: var(--zg-navy) center / cover no-repeat; }
    .zg-hero img { height: 88%; }
    .zg-note { font-size: 15px !important; color: var(--text-muted); }
    .zg-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
    .zg-chip { font-size: 14px; border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; background: var(--white); }

    /* 截止日期倒计时 */
    .dl { border: 1px solid var(--border); border-radius: 16px; padding: 28px 32px; transition: background .5s; }
    .dl[data-phase="5"] { background: #FFF5F4; }
    .dl-meter { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
    .dl-meter-l { font-size: 13px; color: var(--text-faint); white-space: nowrap; }
    .dl-bar { flex: 1; height: 8px; border-radius: 999px; background: var(--gray-100); overflow: hidden; }
    .dl-bar span { display: block; height: 100%; width: 100%; border-radius: 999px; background: var(--zg-blue); transition: width .6s ease, background .6s; }
    .dl-track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; position: relative; margin-bottom: 24px; }
    .dl-track::before { content: ""; position: absolute; top: 7px; inset-inline: 7px; height: 2px; background: var(--border); }
    .dl-stop { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: start; background: none; border: none; cursor: pointer; font-family: 'Geist', sans-serif; padding: 0; color: var(--text-faint); transition: color .2s; }
    .dl-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--white); border: 2px solid var(--gray-200); transition: background .2s, border-color .2s, transform .2s; }
    .dl-when { font-size: 12px; }
    .dl-name { font-size: 15px; font-weight: 500; }
    .dl-stop.seen .dl-dot { background: var(--text); border-color: var(--text); }
    .dl-stop.active { color: var(--text); }
    .dl-stop.active .dl-dot { background: var(--zg-blue); border-color: var(--zg-blue); transform: scale(1.25); }
    .dl[data-phase="4"] .dl-stop.active .dl-dot, .dl[data-phase="5"] .dl-stop.active .dl-dot { background: var(--zg-red); border-color: var(--zg-red); }
    .dl-card { display: none; }
    .dl-card.active { display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: center; animation: stFade .35s ease; }
    .dl-quote { font-family: 'Instrument Serif', serif; font-size: 36px; line-height: 1.2; margin: 0 !important; }
    html[lang="zh-CN"] .dl-quote { font-family: 'Geist', sans-serif; font-size: 28px; font-weight: 500; }
    .dl-card ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .dl-card li { font-size: 16px; line-height: 1.5; padding-inline-start: 18px; position: relative; }
    .dl-card li::before { content: ""; position: absolute; inset-inline-start: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: var(--zg-blue); }
    .dl[data-phase="4"] .dl-card li::before, .dl[data-phase="5"] .dl-card li::before { background: var(--zg-red); }
    .dl-nav { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
    [dir="rtl"] .dl-nav svg, [dir="rtl"] .fm-ctrl svg { transform: scaleX(-1); }

    /* 数字 */
    .zg-stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .zg-stat { padding: 32px 24px; }
    .zg-stat + .zg-stat { border-inline-start: 1px solid var(--border); }
    .zg-num { font-size: 56px; font-weight: 500; letter-spacing: -.03em; line-height: 1; color: var(--zg-blue); direction: ltr; text-align: start; }
    .zg-stat-l { font-size: 15px; line-height: 1.5; margin-top: 12px; }
    .zg-stat-d { font-size: 13px; color: var(--text-faint); margin-top: 6px; }
    .zg-stats.ads .zg-num { color: var(--text); font-size: 44px; }
    .seo-ads-h { margin-top: 40px; margin-bottom: 16px; font-size: 20px; font-weight: 500; }

    /* 睡眠滑块 */
    .sl { display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 48px; align-items: end; border: 1px solid var(--border); border-radius: 16px; padding: 32px; background: linear-gradient(180deg, #F4F7FE 0%, var(--white) 100%); }
    .sl-lbl { font-size: 13px; color: var(--text-faint); }
    .sl-val { font-size: 22px; font-weight: 500; margin: 6px 0 14px; min-height: 1.4em; }
    .sl-ctrl input[type=range] { width: 100%; accent-color: var(--zg-blue); margin-bottom: 24px; }
    .sl-big { font-size: 64px; font-weight: 500; letter-spacing: -.03em; line-height: 1; color: var(--zg-blue); transition: color .3s; }
    .sl-of { font-size: 20px; color: var(--text-faint); margin-inline-start: 6px; letter-spacing: 0; }
    .sl-chart { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; align-items: end; height: 240px; direction: ltr; }
    .sl-col { display: flex; flex-direction: column; align-items: stretch; gap: 8px; height: 100%; justify-content: flex-end; cursor: pointer; }
    .sl-bar { height: calc(var(--v) / 5 * 100%); border-radius: 8px 8px 4px 4px; background: var(--gray-100); position: relative; transition: background .3s, transform .3s; }
    .sl-bar span { position: absolute; top: 8px; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 500; color: var(--text-muted); }
    .sl-col.on .sl-bar { background: var(--zg-blue); }
    .sl-col.on .sl-bar span { color: #fff; }
    .sl-x { font-size: 12px; color: var(--text-faint); text-align: center; line-height: 1.3; min-height: 2.6em; }
    .sl-col.on .sl-x { color: var(--text); font-weight: 500; }

    /* 横向条形 */
    .pl-bars { display: flex; flex-direction: column; gap: 12px; margin: 16px 0 8px; }
    .pl-row { display: grid; grid-template-columns: 160px 1fr 48px; gap: 12px; align-items: center; }
    .pl-l { font-size: 14px; }
    .pl-v { font-size: 14px; font-weight: 500; text-align: end; }
    .pl-track { height: 12px; border-radius: 999px; background: var(--gray-100); overflow: hidden; }
    .pl-track span { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--zg-blue); transition: width 1s cubic-bezier(.2,.7,.2,1); }
    .pl-bars.seen .pl-track span { width: calc(var(--v) / 5 * 100%); }
    .pl-track.eff span { background: var(--zg-green); }

    /* 年龄段 */
    .ag-card { border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 8px; }
    .ag-panel { display: none; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .ag-panel.active { display: grid; animation: stFade .35s ease; }
    .ag-k { font-size: 12px; color: var(--text-faint); margin-bottom: 8px; }
    .ag-v { font-size: 36px; font-weight: 500; letter-spacing: -.02em; }
    .ag-v small { font-size: 14px; color: var(--text-faint); letter-spacing: 0; }
    .ag-c { font-size: 18px; font-weight: 500; line-height: 1.4; }
    .ag-meter { height: 6px; border-radius: 999px; background: var(--gray-100); margin-top: 10px; overflow: hidden; }
    .ag-meter span { display: block; height: 100%; width: calc(var(--v) / 5 * 100%); background: var(--zg-blue); border-radius: 999px; }

    /* 学习目标阶梯 */
    .lo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-items: end; height: 260px; margin: 12px 0 28px; }
    .lo-step { height: var(--h); background: var(--gray-50); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; transition: background .25s, color .25s, transform .25s; cursor: default; }
    .lo-step:hover, .lo-step.on { background: var(--zg-blue); color: #fff; border-color: var(--zg-blue); transform: translateY(-4px); }
    .lo-n { font-size: 12px; opacity: .6; }
    .lo-t { font-size: 15px; font-weight: 500; line-height: 1.35; }

    /* 五张功能卡 */
    .fc-grid.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }

    /* 测验 */
    .qz { border-radius: 20px; background: var(--zg-navy); color: #fff; padding: 48px; min-height: 380px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .qz::before { content: ""; position: absolute; inset: -40% -10% auto auto; width: 60%; aspect-ratio: 1; background: radial-gradient(circle, rgba(47,102,214,.55), transparent 65%); pointer-events: none; }
    .qz-screen { display: none; width: 100%; max-width: 620px; text-align: center; position: relative; }
    .qz-screen.active { display: block; animation: stFade .35s ease; }
    .qz-badge { width: 96px; height: 96px; margin: 0 auto 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 500; }
    .qz .tm-btn { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }
    .qz .tm-btn.solid { background: #fff; color: var(--zg-navy); border-color: #fff; font-size: 15px; padding: 12px 24px; }
    .qz-note { font-size: 13px !important; color: rgba(255,255,255,.55); margin-top: 16px !important; }
    .qz-progress { display: flex; gap: 4px; margin-bottom: 20px; }
    .qz-progress span { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.2); transition: background .3s; }
    .qz-progress span.on { background: #fff; }
    .qz-count { font-size: 13px; color: rgba(255,255,255,.6); margin-bottom: 12px; }
    .qz-q { font-size: 26px !important; line-height: 1.4 !important; font-weight: 500; min-height: 2.8em; margin-bottom: 28px !important; }
    .qz-scale { display: flex; align-items: center; gap: 12px; justify-content: center; }
    .qz-end { font-size: 12px; color: rgba(255,255,255,.6); width: 64px; }
    .qz-opts { display: flex; gap: 8px; direction: ltr; }
    .qz-opt { width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.4); background: transparent; color: #fff; font-family: 'Geist', sans-serif; font-size: 17px; cursor: pointer; transition: background .15s, color .15s, transform .15s; }
    .qz-opt:hover { background: rgba(255,255,255,.15); transform: scale(1.06); }
    .qz-opt.picked { background: #fff; color: var(--zg-navy); }
    .qz-back { margin-top: 24px; background: none; border: none; color: rgba(255,255,255,.6); font-family: 'Geist', sans-serif; font-size: 13px; cursor: pointer; }
    .qz-back:disabled { visibility: hidden; }
    .qz-lbl { font-size: 13px; color: rgba(255,255,255,.6); }
    .qz-score { font-size: 80px; font-weight: 500; letter-spacing: -.04em; line-height: 1; margin: 6px 0 20px; direction: ltr; }
    .qz-score small { font-size: 22px; color: rgba(255,255,255,.5); letter-spacing: 0; }
    .qz-gauge { position: relative; margin: 0 auto 28px; max-width: 460px; direction: ltr; }
    .qz-bands { display: grid; grid-template-columns: 11fr 4fr 8fr 5fr 9fr; gap: 3px; height: 10px; }
    .qz-bands span { border-radius: 3px; background: rgba(255,255,255,.18); }
    .qz-bands span:nth-child(1) { background: #7FD1A3; } .qz-bands span:nth-child(2) { background: #B9E28C; } .qz-bands span:nth-child(3) { background: #F3D46B; } .qz-bands span:nth-child(4) { background: #F39A5B; } .qz-bands span:nth-child(5) { background: var(--zg-red); }
    .qz-marker { position: absolute; top: -6px; width: 4px; height: 22px; border-radius: 2px; background: #fff; box-shadow: 0 0 0 3px var(--zg-navy); left: 0; transform: translateX(-50%); transition: left .8s cubic-bezier(.2,.7,.2,1); }
    .qz-ticks { display: flex; justify-content: space-between; font-size: 11px; color: rgba(255,255,255,.5); margin-top: 6px; }
    .qz-tier { font-size: 26px; font-weight: 500; margin: 6px 0 6px; }
    .qz-mantra { font-family: 'Instrument Serif', serif; font-size: 24px !important; color: rgba(255,255,255,.85); margin-bottom: 24px !important; }

    /* 艾森豪威尔矩阵 */
    .mx { border: 1px solid var(--border); border-radius: 20px; padding: 24px; }
    .mx-top { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .mx-top .tm-btn { margin-inline-start: auto; }
    .mx-ring { position: relative; width: 56px; height: 56px; flex-shrink: 0; }
    .mx-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .mx-ring circle { fill: none; stroke-width: 5; }
    .mx-ring-bg { stroke: var(--gray-100); }
    .mx-ring-fg { stroke: var(--zg-green); stroke-linecap: round; transition: stroke-dashoffset .5s; }
    .mx-ring span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; }

    .mx-task { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px 8px 8px; border-radius: 999px; background: var(--white); border: 1px solid var(--border); font-size: 14px; cursor: grab; user-select: none; transition: box-shadow .15s, opacity .15s, transform .15s; font-family: 'Geist', sans-serif; color: var(--text); }

    .mx-check svg { width: 12px; height: 12px; stroke: #fff; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }

    /* 命名演变 */
    .nm { border: 1px solid var(--border); border-radius: 16px; padding: 28px 32px; }
    .nm-track { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; position: relative; margin-bottom: 20px; }
    .nm-track::before { content: ""; position: absolute; top: 7px; inset-inline: 7px; height: 2px; background: var(--border); }
    .nm-stop { position: relative; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; background: none; border: none; cursor: pointer; padding: 0; text-align: start; font-family: 'Geist', sans-serif; color: var(--text-faint); }
    .nm-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--white); border: 2px solid var(--gray-200); transition: all .2s; }
    .nm-name { font-size: 16px; font-weight: 500; line-height: 1.3; }

    .nm-desc { display: none; font-size: 16px !important; line-height: 1.6 !important; margin: 0 !important; }
    .nm-desc.active { display: block; animation: stFade .35s ease; }

    /* 深浅模式 */
    .md { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: center; border-radius: 20px; padding: 40px; background: var(--gray-50); transition: background .5s; }
    .md.dark { background: var(--zg-navy); color: #fff; }
    .md.dark .md-ctrl p { color: rgba(255,255,255,.7); }
    .md.dark .seg { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.15); }
    .md.dark .seg-btn { color: rgba(255,255,255,.7); }
    .md.dark .seg-btn.active { background: #fff; color: var(--zg-navy); }
    .md-phone { height: 520px; display: flex; justify-content: center; }
    .md-iphone { height: 100%; }
    .md-shot { position: absolute; inset: 0; background: #111 center / cover no-repeat; transition: opacity .5s; }
    .md-light { background-color: #F3F3F1; }
    .md.dark .md-light { opacity: 0; }
    .md-ctrl h3 { font-size: 22px; font-weight: 500; margin-bottom: 10px; }
    .md-ctrl p { font-size: 16px; line-height: 1.6; color: var(--text-muted); margin-bottom: 20px; }

    /* 海报画廊 */
    .pg { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; scrollbar-width: thin; }
    .pg-card { flex: 0 0 240px; scroll-snap-align: start; text-align: start; background: none; border: none; padding: 0; cursor: zoom-in; font-family: 'Geist', sans-serif; color: var(--text); }
    .pg-img { aspect-ratio: 1400 / 1994; border-radius: 10px; background: var(--gray-100) center / cover no-repeat; margin-bottom: 12px; transition: transform .25s, box-shadow .25s; }
    .pg-card:hover .pg-img { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,.12); }
    .pg-t { font-size: 14px; font-weight: 500; line-height: 1.4; margin-bottom: 4px; }
    .pg-d { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
    .pg-box { position: fixed; inset: 0; z-index: 320; background: rgba(13,13,13,.82); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 48px 24px; opacity: 0; pointer-events: none; transition: opacity .2s; }
    .pg-box.open { opacity: 1; pointer-events: auto; }
    .pg-big { height: min(78vh, 900px); aspect-ratio: 1400 / 1994; max-width: 90vw; border-radius: 10px; background: #222 center / contain no-repeat; }
    .pg-cap { color: #fff; font-size: 15px; text-align: center; max-width: 560px; }
    .pg-close { position: absolute; top: 20px; inset-inline-end: 20px; }

    /* 测试结果 */
    .ts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .ts-grid.three { grid-template-columns: repeat(3, 1fr); }
    .ts-card { border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
    .ts-card h4 { font-size: 17px; font-weight: 500; margin-bottom: 6px; }
    .ts-h2 { margin-top: 28px; }
    .ts-sub { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 8px; }
    .ts-card ul, .fav { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
    .ts-card li { font-size: 15px; line-height: 1.5; padding-inline-start: 18px; position: relative; }
    .ts-pain li::before, .ts-next li::before { content: ""; position: absolute; inset-inline-start: 0; top: .6em; width: 7px; height: 7px; border-radius: 50%; }
    .ts-pain li::before { background: var(--zg-red); }
    .ts-next li::before { background: var(--zg-green); }
    .fav li { padding-inline-start: 0; display: flex; gap: 12px; align-items: baseline; }
    .fav-n { width: 26px; height: 26px; border-radius: 50%; background: var(--zg-blue); color: #fff; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .tb { margin: 14px 0 6px; }
    .tb-bar { display: flex; height: 34px; border-radius: 10px; overflow: hidden; background: var(--gray-100); direction: ltr; }
    .tb-seg { width: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 500; overflow: hidden; white-space: nowrap; transition: width 1s cubic-bezier(.2,.7,.2,1); }
    .tb.seen .tb-seg { width: calc(var(--w) * 1%); }
    .tb-lab { display: none; }
    .tb-0 { background: var(--zg-blue); } .tb-1 { background: #8FB0EE; } .tb-2 { background: #C9C9C5; } .tb-3 { background: #E4E4E1; }
    .tb-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 13px; color: var(--text-muted); }
    .tb-leg { display: inline-flex; align-items: center; gap: 6px; }
    .tb-leg i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .tb-leg b { color: var(--text); font-weight: 500; }

    /* 海报 A/B */
    .ab-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 260px)); gap: 24px; justify-content: center; }
    .ab-card { background: none; border: none; padding: 0; cursor: pointer; text-align: start; font-family: 'Geist', sans-serif; color: var(--text); }
    .ab-img { aspect-ratio: 1400 / 1994; border-radius: 12px; background: #F3F3F1 center / cover no-repeat; border: 1px solid var(--border); margin-bottom: 12px; transition: transform .25s, box-shadow .25s; }
    .ab-img.red { background-color: #F7E3E1; }
    .ab-card:hover .ab-img { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,.1); }
    .ab-name { font-size: 15px; font-weight: 500; }
    .ab-res { font-size: 13px; color: var(--text-muted); margin-top: 8px; opacity: 0; transition: opacity .4s; }
    .ab-bar { height: 8px; border-radius: 999px; background: var(--gray-100); overflow: hidden; margin-bottom: 6px; }
    .ab-bar span { display: block; height: 100%; width: 0; background: var(--zg-blue); border-radius: 999px; transition: width .8s cubic-bezier(.2,.7,.2,1); }
    .ab.revealed .ab-res { opacity: 1; }
    .ab.revealed .ab-bar span { width: calc(var(--v) * 1%); }
    .ab.revealed .ab-card.picked .ab-img { box-shadow: 0 0 0 3px var(--text); }
    .ab-verdict { max-width: 560px; margin: 24px auto 0; text-align: center; font-size: 15px; line-height: 1.6; color: var(--text-muted); opacity: 0; transition: opacity .4s; }
    .ab.revealed .ab-verdict { opacity: 1; }
    .ab-verdict b { color: var(--text); }

    /* SEO */
    .seo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .kw-l { font-size: 12px; color: var(--text-faint); margin-top: 14px; }
    .kw-main { background: var(--zg-blue); color: #fff; border-color: var(--zg-blue); font-weight: 500; }
    .kw-neg { text-decoration: line-through; color: var(--text-faint); }
    .serp { border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin: 12px 0 4px; font-family: Arial, sans-serif; }
    .serp-site { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #202124; margin-bottom: 6px; }
    .serp-fav { width: 22px; height: 22px; border-radius: 50%; background: var(--zg-blue); color: #fff; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
    .serp-title { font-size: 19px; color: #1a0dab; line-height: 1.3; margin-bottom: 4px; }
    .serp-desc { font-size: 14px; color: #4d5156; line-height: 1.55; }
    .sx { list-style: none !important; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin: 12px 0 0 !important; }
    .sx-i { font-size: 14px !important; line-height: 1.4 !important; display: flex; gap: 8px; align-items: flex-start; opacity: .25; transition: opacity .3s; margin: 0 !important; }
    .sx-i::before { content: "✓"; color: var(--zg-green); font-weight: 700; }
    .sx.seen .sx-i { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      .dl-card.active, .ag-panel.active, .nm-desc.active, .qz-screen.active { animation: none; }
      .pl-track span, .tb-seg, .ab-bar span, .qz-marker, .dl-bar span { transition: none; }
    }

      .sl-x { font-size: 10px; }

    /* ══════════════════ Edurino 页面专属组件 ══════════════════ */
    :root { --ed-sky: #40C0F0; --ed-orange: #F37D01; --ed-deep: #0369AF; --ed-light: #E1F7FF; }
    .ed-hero { background: #FFFFFF; border: 1px solid var(--border); }
    .ed-hero img { height: 80%; }

    /* 两个观众 */
    .au { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: stretch; }
    .au-card { border-radius: 16px; padding: 28px; }
    .au-kid { background: var(--ed-light); }
    .au-parent { background: #FFF0E8; }
    .au-ico { font-size: 32px; margin-bottom: 14px; }
    .au-h { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
    .au-card p { font-size: 15px; line-height: 1.6; color: var(--text-muted); }
    .au-plus { align-self: center; font-size: 28px; color: var(--text-faint); }

    /* 立式展示屏外框 */
    .kiosk { position: relative; display: flex; flex-direction: column; align-items: center; }
    .kiosk-body { width: 100%; padding: 10px; background: #1b1b1b; border-radius: 18px; box-shadow: 0 18px 40px rgba(0,0,0,.18), inset 0 0 0 1px #333; position: relative; z-index: 1; }
    .kiosk-screen { position: relative; aspect-ratio: 1080 / 1920; border-radius: 10px; overflow: hidden; background: var(--ed-sky); }
    .kiosk-pole { width: 14%; height: 48px; background: linear-gradient(90deg, #cfcfcc, #ececea, #cfcfcc); }
    .kiosk-base { width: 62%; height: 14px; border-radius: 8px 8px 4px 4px; background: linear-gradient(180deg, #e2e2df, #c3c3c0); box-shadow: 0 6px 14px rgba(0,0,0,.12); }

    /* 体验流程 */
    .kf { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 48px; align-items: center; }
    .kf-list { list-style: none; border-top: 1px solid var(--border); }
    .kf-step { position: relative; width: 100%; display: grid; grid-template-columns: 34px 1fr; gap: 8px; padding: 14px 0; border: none; border-bottom: 1px solid var(--border); background: none; text-align: start; cursor: pointer; font-family: 'Geist', sans-serif; font-size: 15px; line-height: 1.5; color: var(--text-faint); transition: color .2s; }
    .kf-step:hover { color: var(--text-muted); }
    .kf-step.seen { color: var(--text-muted); }
    .kf-step.active { color: var(--text); }
    .kf-n { font-size: 13px; padding-top: 2px; }
    .kf-step.active .kf-n { color: var(--ed-orange); font-weight: 500; }
    .kf-step::after { content: ""; position: absolute; inset-inline-start: 0; bottom: -1px; height: 2px; width: 0; background: var(--ed-orange); }
    .kf-step.active::after { width: 100%; }
    .kf-step.active.playing::after { animation: fmProgress var(--kf-dur, 3000ms) linear forwards; }
    .kf-stage { max-width: 300px; width: 100%; justify-self: center; }
    .kf-shot { position: absolute; inset: 0; background: var(--ed-sky) center / cover no-repeat; opacity: 0; transition: opacity .45s; display: flex; align-items: center; justify-content: center; }
    .kf-shot.active { opacity: 1; }
    .kf-ph { color: rgba(255,255,255,.85); font-size: 13px; font-family: 'Quicksand', 'Geist', sans-serif; font-weight: 600; }
    .kf-shot.has-img .kf-ph { display: none; }

    /* 家长视角：注意力 */
    .at { border: 1px solid var(--border); border-radius: 16px; padding: 28px; margin-bottom: 16px; }
    .at-head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .at-char { width: 64px; height: 64px; border-radius: 16px; background: var(--ed-light) center / contain no-repeat; flex-shrink: 0; }
    .at-name { font-family: 'Quicksand', 'Geist', sans-serif; font-size: 24px; font-weight: 700; color: var(--ed-deep); }
    .at-age { font-size: 13px; color: var(--text-faint); }

    .at-tab { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--white); cursor: pointer; font-family: 'Geist', sans-serif; font-size: 14px; text-align: start; color: var(--text-muted); transition: all .2s; }
    .at-n { width: 26px; height: 26px; border-radius: 50%; background: var(--ed-light); color: var(--ed-deep); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; }

    .at-panel.active { display: block; animation: stFade .35s ease; }
    .at-h { font-size: 22px; font-weight: 500; margin-bottom: 6px; }
    .at-e { display: inline-block; font-size: 14px; color: var(--ed-orange); background: #FFF0E8; border-radius: 999px; padding: 4px 12px; margin-bottom: 12px; }
    .at-panel p { font-size: 16px; line-height: 1.65; color: var(--text-muted); max-width: 640px; }
    .leo { display: flex; gap: 16px; align-items: flex-start; background: var(--gray-50); border-radius: 16px; padding: 24px 28px; }
    .leo-h { font-size: 17px; font-weight: 500; margin-bottom: 6px; }
    .leo p { font-size: 15px; line-height: 1.6; color: var(--text-muted); }

    /* 三步上手 */

    .ed-step-h { font-size: 18px; font-weight: 500; margin-bottom: 10px; }
    .ed-step p { font-size: 15px; line-height: 1.6; color: var(--text-muted); }
    .ed-chips { display: flex; flex-direction: column; gap: 6px; }

    /* My Box 小游戏 */
    .bx { display: flex; justify-content: center; }

    .bx-logo { width: fit-content; margin: 0 auto 16px; background: #fff; color: var(--ed-sky); font-weight: 700; letter-spacing: .04em; border-radius: 10px; padding: 4px 14px; font-size: 16px; }
    .bx-title { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 14px; }
    .bx-progress { position: relative; height: 34px; border-radius: 999px; background: rgba(255,255,255,.55); overflow: hidden; margin-bottom: 16px; }
    .bx-progress span { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ed-orange); border-radius: 999px; transition: width .45s cubic-bezier(.2,.7,.2,1); }
    [dir="rtl"] .bx-progress span { inset: 0 0 0 auto; }
    .bx-progress b { position: relative; display: flex; height: 100%; align-items: center; justify-content: center; font-size: 15px; color: var(--ed-deep); }
