var LANG_META = {
  zh: { label:"中文",    html:"zh-CN" },
  en: { label:"English", html:"en" },
  de: { label:"Deutsch", html:"de" },
  tr: { label:"Türkçe",  html:"tr" },
  ar: { label:"العربية", html:"ar", dir:"rtl" }
};

function detectLang() {
  var urlLang = new URLSearchParams(window.location.search).get('lang');
  if (urlLang && T[urlLang]) return urlLang;
  var b = (navigator.language || "zh").toLowerCase();
  if (b.startsWith("de")) return "de";
  if (b.startsWith("zh")) return "zh";
  if (b.startsWith("tr")) return "tr";
  if (b.startsWith("ar")) return "ar";
  return "en";
}

var currentLang = detectLang();

function updateLangLinks(lang) {
  document.querySelectorAll('a[href$=".html"], a[href*=".html?"], a[href*=".html#"]').forEach(function(a) {
    var url = new URL(a.getAttribute('href'), window.location.href);
    url.searchParams.set('lang', lang);
    a.setAttribute('href', url.pathname.split('/').pop() + url.search + url.hash);
  });
}

function setLang(lang) {
  if (!T[lang]) return;
  currentLang = lang;
  document.documentElement.lang = LANG_META[lang].html;
  document.documentElement.dir = LANG_META[lang].dir || "ltr";   /* 阿拉伯语从右往左 */
  document.querySelectorAll("[data-i18n]").forEach(function(el) {
    var k = el.getAttribute("data-i18n");
    if (T[lang][k] == null) return;
    if (HTML_KEYS.indexOf(k) > -1) el.innerHTML = T[lang][k];
    else el.textContent = T[lang][k];
  });
  document.getElementById("langBtnLabel").textContent = LANG_META[lang].label;
  document.querySelectorAll(".lang-option").forEach(function(o) { o.classList.toggle("active", o.dataset.lang === lang); });
  document.querySelectorAll(".drawer-lang-pill").forEach(function(b) { b.classList.toggle("active", b.dataset.lang === lang); });
  closeLangDropdown();
  updateLangLinks(lang);
  if (typeof fcSlide === "function") fcSlide();
  if (window.stRefreshLang) window.stRefreshLang();
  if (window.zgRefreshLang) window.zgRefreshLang();
  if (window.edRefreshLang) window.edRefreshLang();
  if (window.wcRefreshLang) window.wcRefreshLang();
  if (window.pfRefresh) window.pfRefresh();
  if (typeof fmBackdrop !== "undefined" && fmBackdrop.classList.contains("open")) fmRender();
}

/* ── Lang dropdown ── */
var langBtn = document.getElementById("langBtn");
var langDropdown = document.getElementById("langDropdown");
function closeLangDropdown() {
  langDropdown.classList.remove("open"); langBtn.classList.remove("open");
  langBtn.setAttribute("aria-expanded","false");
}
langBtn.addEventListener("click", function(e) {
  e.stopPropagation();
  if (langDropdown.classList.contains("open")) closeLangDropdown();
  else { langDropdown.classList.add("open"); langBtn.classList.add("open"); langBtn.setAttribute("aria-expanded","true"); }
});
document.querySelectorAll(".lang-option").forEach(function(o) {
  o.addEventListener("click", function() { setLang(this.dataset.lang); });
});
document.querySelectorAll(".drawer-lang-pill").forEach(function(b) {
  b.addEventListener("click", function() { setLang(this.dataset.lang); });
});
document.addEventListener("click", function(e) {
  if (!document.getElementById("langSwitcher").contains(e.target)) closeLangDropdown();
});

/* ── Hamburger ── */
var hamburger = document.getElementById("hamburger");
var drawer = document.getElementById("nav-drawer");
hamburger.addEventListener("click", function() {
  if (drawer.classList.contains("open")) closeDrawer();
  else { drawer.classList.add("open"); hamburger.classList.add("open"); hamburger.setAttribute("aria-expanded","true"); document.body.style.overflow="hidden"; closeLangDropdown(); }
});
function closeDrawer() {
  drawer.classList.remove("open"); hamburger.classList.remove("open");
  hamburger.setAttribute("aria-expanded","false"); document.body.style.overflow="";
}
window.addEventListener("resize", function() { if (window.innerWidth >= 768) closeDrawer(); });

/* ── 目录高亮：滚到哪一节，目录对应项变黑 ── */
var tocLinks = document.querySelectorAll(".p-toc a");
var observer = new IntersectionObserver(function(entries) {
  entries.forEach(function(entry) {
    if (!entry.isIntersecting) return;
    tocLinks.forEach(function(a) {
      a.classList.toggle("active", a.getAttribute("href") === "#" + entry.target.id);
    });
  });
}, { rootMargin: "-30% 0px -60% 0px" });
document.querySelectorAll(".p-content > section[id]").forEach(function(s) { observer.observe(s); });

/* ── 分享：手机调起系统分享，电脑复制链接 ── */
document.getElementById("shareBtn").addEventListener("click", function() {
  var btnText = this.querySelector("span");
  if (navigator.share) {
    navigator.share({ title: document.title, url: location.href });
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(location.href).then(function() {
      btnText.textContent = T[currentLang]["p.copied"];
      setTimeout(function() { btnText.textContent = T[currentLang]["p.share"]; }, 2000);
    });
  }
});

/* ── 功能卡片：产品图随滚动从右侧滑入 ──
   卡片顶部进入屏幕底部时开始（藏在右侧外面），
   滚到屏幕约 40% 高度时完全到位；三张卡片依次错开一点。 */
var fcProducts = document.querySelectorAll(".fc-product");
var fcReduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function fcSlide() {
  if (fcReduce) return;
  var vh = window.innerHeight;
  fcProducts.forEach(function(img, i) {

(function() {
  var TG_VIDEO = "images/srh/touchgo-screen.mp4";   /* 优先用视频 */
  var TG_SHOT  = "images/srh/touchgo-screen.png";   /* 没有视频时用截图 */
  var TG_DURATION = 3500;
  var ZONES = ["top", "left", "right"];
  var root = document.getElementById("tgExplorer");
  if (!root) return;
  var screen = document.getElementById("tgScreen");
  var items = root.querySelectorAll(".tg-item");
  var zones = root.querySelectorAll(".tg-zone");
  var current = 0, timer = null, auto = true, started = false;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    var test = new Image();

    test.src = TG_SHOT;
  }

    screen.classList.add("has-video");
    if (inView && !reduce) { var p = video.play(); if (p && p.catch) p.catch(function() {}); }
  });
  video.addEventListener("error", loadShot);      /* 视频不存在 → 退回截图 */
  video.src = TG_VIDEO;

    new IntersectionObserver(function(entries) {

        inView = e.isIntersecting;

        if (inView) { var p = video.play(); if (p && p.catch) p.catch(function() {}); }
        else video.pause();

    }, { threshold: 0.2 }).observe(screen);
  }

  function show(i, playing) {
    current = i;
    var key = ZONES[i];
    screen.classList.add("has-active");
    zones.forEach(function(z) { z.classList.toggle("active", z.dataset.zone === key); });
    items.forEach(function(it) {
      var on = it.dataset.zone === key;

    });
  }
  function next() {
    if (!auto) return;
    show((current + 1) % ZONES.length, true);
    timer = setTimeout(next, TG_DURATION);
  }
  function stopAuto() {
    auto = false; clearTimeout(timer);
    items.forEach(function(it) { it.classList.remove("playing"); });
  }
  function pick(key) { stopAuto(); show(ZONES.indexOf(key), false); }

  items.forEach(function(it) { it.addEventListener("click", function() { pick(this.dataset.zone); }); });
  zones.forEach(function(z) {
    z.addEventListener("click", function() { pick(this.dataset.zone); });

        show(0, true); timer = setTimeout(next, TG_DURATION);

    });
  }, { threshold: 0.5 }).observe(root);
})();

  return FM_DIR + item.key + "-" + (fmStep + 1) + "." + item.ext;
}
function fmPhText() { return fmText("fc.img").replace("{n}", fmStep + 1); }

/* 当前步骤开始走进度线，duration 毫秒后进入下一步 */
function fmStartTimer(duration) {
  clearTimeout(fmTimer);
  var current = document.querySelector(".fm-step.active");
  if (!current) return;
  current.style.setProperty("--fm-dur", duration + "ms");
  current.classList.remove("playing"); void current.offsetWidth;
  current.classList.add("playing");
  fmTimer = setTimeout(fmAdvance, duration);
}
function fmAdvance() {
  if (fmStep < fmCount() - 1) {
    fmGoStep(fmStep + 1, true);
  } else {
    var current = document.querySelector(".fm-step.active");
    if (current) current.classList.remove("playing");
    document.getElementById("fmResult").classList.add("show");
    document.querySelector(".fm-main").classList.add("has-result");
  }
}

function fmShowImage() {
  var src = fmSrc(), token = src;
  fmImgPh.textContent = fmPhText();
  fmImg.classList.add("fading");
  fmImg.dataset.token = token;
  var test = new Image();
  test.onload = function() {
    if (fmImg.dataset.token !== token) return;
    fmImg.style.backgroundImage = "url('" + src + "')";
    fmImg.classList.add("has-img"); fmImg.classList.remove("fading");
  };
  test.onerror = function() {
    if (fmImg.dataset.token !== token) return;
    fmImg.style.backgroundImage = "";
    fmImg.classList.remove("has-img", "fading");
  };
  test.src = src;
  if (fmAutoplay && !fmReduce) fmStartTimer(FM_DURATION);
}

/* 把唯一的视频播放器、轮播图和占位文字放进当前产品对应的外框里 */
function fmMountDevice(device) {
  var screen = document.getElementById(device === "tablet" ? "fmTabletScreen" : "fmPhoneScreen");
  document.getElementById("fmDevice").classList.toggle("is-tablet", device === "tablet");
  if (fmVideo.parentElement === screen) return;
  var notch = screen.querySelector(".iphone-notch");
  [fmVideo, fmSlideA, fmSlideB, fmVideoPh].forEach(function(el) {
    if (notch) screen.insertBefore(el, notch); else screen.appendChild(el);
  });
  var other = document.getElementById(device === "tablet" ? "fmPhoneScreen" : "fmTabletScreen");
  other.classList.remove("has-video", "is-slides");
}

var fmSlideA = document.getElementById("fmSlideA");
var fmSlideB = document.getElementById("fmSlideB");
var fmSlideTimer = null;

function fmClearSlides() {
  clearTimeout(fmSlideTimer);
  fmSlideA.classList.remove("show"); fmSlideB.classList.remove("show");
  fmSlideA.removeAttribute("src"); fmSlideB.removeAttribute("src");
  fmVideo.parentElement.classList.remove("is-slides");
}

/* 图片轮播：第一张显示 interval 毫秒后淡入第二张，然后停住 */
function fmShowSlides(cfg) {
  var screen = fmVideo.parentElement;
  fmVideo.pause(); fmVideo.removeAttribute("src"); fmVideo.load();
  fmClearSlides();
  screen.classList.add("is-slides");
  screen.classList.remove("has-video");
  fmVideoPh.textContent = fmText("fc.img").replace("{n}", fmStep + 1);

  var token = FM_ITEMS[fmIndex].key + "-" + fmStep;
  screen.dataset.token = token;
  fmSlideA.onload = function() {
    if (screen.dataset.token !== token) return;
    screen.classList.add("has-video");          /* 隐藏占位文字 */
    fmSlideA.classList.add("show");
  };
  fmSlideA.onerror = function() {};
  fmSlideA.src = FM_DIR + cfg.files[0];
  var hasSecond = cfg.files.length > 1;
  if (hasSecond) fmSlideB.src = FM_DIR + cfg.files[1];

  if (!hasSecond) {
    /* 只有一张图：一直显示这一张 */
  } else if (!fmReduce) {
    fmSlideTimer = setTimeout(function() {
      if (screen.dataset.token !== token) return;
      fmSlideB.classList.add("show");
    }, cfg.interval);
  } else {
    fmSlideB.classList.add("show");             /* 减少动态效果：直接显示第二张 */
  }
  if (fmAutoplay && !fmReduce) fmStartTimer(cfg.interval + cfg.hold);
}

function fmShowVideo() {
  var cur = FM_ITEMS[fmIndex];
  var override = (cur.stepOverrides || {})[fmStep + 1] ||
    (cur.screens ? { type: "slides", files: [cur.key + "-" + (fmStep + 1) + ".png"], interval: FM_DURATION, hold: 0 } : null);
  if (override && override.type === "slides") { fmShowSlides(override); return; }
  fmClearSlides();
  var src = fmSrc(), screen = fmVideo.parentElement;
  fmVideoPh.textContent = fmText("fc.vid").replace("{n}", fmStep + 1);
  screen.classList.remove("has-video");
  fmVideo.pause();
  fmVideo.loop = !fmAutoplay;            /* 手动查看时循环播放 */
  fmVideo.dataset.token = src;
  fmVideo.src = src;
  fmVideo.load();
}
fmVideo.addEventListener("loadeddata", function() {
  fmVideo.parentElement.classList.add("has-video");
  if (fmReduce) return;                  /* 减少动态效果：停在第一帧 */
  var p = fmVideo.play();
  if (p && p.catch) p.catch(function() {});
  if (fmAutoplay) fmStartTimer(Math.round(fmVideo.duration * 1000) || FM_DURATION);
});
fmVideo.addEventListener("error", function() {
  if (fmVideo.parentElement.classList.contains("is-slides") || !fmVideo.getAttribute("src")) return;
  fmVideo.parentElement.classList.remove("has-video");
  if (fmAutoplay && !fmReduce) fmStartTimer(FM_DURATION);   /* 没有视频时按默认时长继续 */
});

function fmRenderSteps() {
  var item = FM_ITEMS[fmIndex];
  var ol = document.getElementById("fmSteps");
  ol.innerHTML = "";
  for (var i = 0; i < fmCount(); i++) {
    var li = document.createElement("li");
    var btn = document.createElement("button");
    btn.className = "fm-step";
    btn.dataset.step = i;
    btn.innerHTML = '<span class="fm-step-num">' + String(i + 1).padStart(2, "0") + '</span><span></span>';
    btn.lastChild.textContent = fmText("fc." + item.key + ".s" + (i + 1));
    btn.addEventListener("click", function() { fmGoStep(parseInt(this.dataset.step, 10), false); });
    li.appendChild(btn);
    ol.appendChild(li);
  }
}

function fmRender() {
  var item = FM_ITEMS[fmIndex];
  document.querySelectorAll(".fm-tab").forEach(function(t, i) {
    t.classList.toggle("active", i === fmIndex);
    t.setAttribute("aria-selected", i === fmIndex ? "true" : "false");
  });
  fmStage.classList.toggle("is-video", item.media === "video");
  fmImg.style.padding = item.imgInset || "0";
  fmMountDevice(item.device || "iphone");
  document.getElementById("fmTitle").textContent = item.titleKey ? fmText(item.titleKey) : item.title;
  var icon = document.getElementById("fmIcon");
  icon.hidden = false;
  icon.parentElement.hidden = false;
  icon.onerror = function() { this.hidden = true; this.parentElement.hidden = true; };
  icon.src = FM_ICON_DIR + item.icon;
  icon.alt = item.titleKey ? fmText(item.titleKey) : item.title;
  document.getElementById("fmScenario").textContent = fmText("fc." + item.key + ".q");
  document.getElementById("fmResult").textContent = fmText("fc." + item.key + ".r");
  fmRenderSteps();
  fmGoStep(fmStep, true);
}

function fmGoStep(n, autoplay) {
  clearTimeout(fmTimer);
  fmAutoplay = autoplay;
  fmStep = Math.max(0, Math.min(fmCount() - 1, n));
  document.querySelectorAll(".fm-step").forEach(function(b, i) {
    b.classList.remove("active", "playing");
    b.classList.toggle("seen", i < fmStep);
    if (i === fmStep) b.classList.add("active");
  });
  document.getElementById("fmResult").classList.remove("show");
  document.querySelector(".fm-main").classList.remove("has-result");
  document.getElementById("fmCurrentNum").textContent = String(fmStep + 1).padStart(2, "0");
  document.getElementById("fmCurrentText").textContent = fmText("fc." + FM_ITEMS[fmIndex].key + ".s" + (fmStep + 1));
  document.getElementById("fmPrev").disabled = fmStep === 0;
  document.getElementById("fmNext").disabled = fmStep === fmCount() - 1;
  if (FM_ITEMS[fmIndex].media === "video") fmShowVideo();
  else { fmVideo.pause(); fmClearSlides(); fmShowImage(); }
}

function fmOpen(i) {
  fmIndex = i; fmStep = 0;
  fmLastFocus = document.activeElement;
  fmRender();
  fmBackdrop.classList.add("open");
  fmBackdrop.setAttribute("aria-hidden", "false");
  document.body.classList.add("fm-locked");
  document.getElementById("fmClose").focus();
}
function fmClose() {
  clearTimeout(fmTimer);
  fmVideo.pause();
  fmClearSlides();
  fmBackdrop.classList.remove("open");
  fmBackdrop.setAttribute("aria-hidden", "true");
  document.body.classList.remove("fm-locked");
  if (fmLastFocus) fmLastFocus.focus();
}

document.querySelectorAll(".fc-card").forEach(function(card) {
  card.addEventListener("click", function() { fmOpen(parseInt(this.dataset.index, 10)); });
});
document.querySelectorAll(".fm-tab").forEach(function(tab) {
  tab.addEventListener("click", function() { fmIndex = parseInt(this.dataset.index, 10); fmStep = 0; fmRender(); });
});
document.getElementById("fmClose").addEventListener("click", fmClose);
document.getElementById("fmPrev").addEventListener("click", function() { fmGoStep(fmStep - 1, false); });
document.getElementById("fmNext").addEventListener("click", function() { fmGoStep(fmStep + 1, false); });
document.getElementById("fmReplay").addEventListener("click", function() { fmGoStep(0, true); });
fmBackdrop.addEventListener("click", function(e) { if (e.target === fmBackdrop) fmClose(); });

/* 手机上在图片 / 设备上左右滑动切换步骤（阿拉伯语方向相反） */
var fmTouchX = null, fmTouchY = null;
fmStage.addEventListener("touchstart", function(e) {
  fmTouchX = e.touches[0].clientX; fmTouchY = e.touches[0].clientY;
}, { passive: true });
fmStage.addEventListener("touchend", function(e) {
  if (fmTouchX === null) return;
  var dx = e.changedTouches[0].clientX - fmTouchX;
  var dy = e.changedTouches[0].clientY - fmTouchY;
  fmTouchX = null;
  if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy)) return;   /* 太短或主要是上下滑，忽略 */
  var forward = dx < 0;
  if (document.documentElement.dir === "rtl") forward = !forward;
  fmGoStep(fmStep + (forward ? 1 : -1), false);
});
document.addEventListener("keydown", function(e) {
  if (!fmBackdrop.classList.contains("open")) return;
  if (e.key === "Escape") fmClose();
  if (e.key === "ArrowLeft") fmGoStep(fmStep - 1, false);
  if (e.key === "ArrowRight") fmGoStep(fmStep + 1, false);
});

setLang(currentLang);
</script>
<script>
/* ── Hero：显示器随滚动从“标志下方的小屏”放大到几乎全屏 ── */
(function () {
  var pin = document.getElementById("wfxPin"), head = document.getElementById("wfxHead"),
      mon = document.getElementById("wfxMon"), stand = document.getElementById("wfxStand"), cue = document.getElementById("wfxCue");
  if (!pin) return;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var SCREEN = 0.978 * 9 / 16 + 0.022;          /* 屏幕框的高宽比（含边框） */
  var W1 = 0, W0 = 0, y0 = 0, y1 = 0, ticking = false;
  function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function layout() {
    var vw = document.documentElement.clientWidth, vh = window.innerHeight;
    W1 = Math.min(vw * 0.96, (vh * 0.94) / SCREEN);              /* 终点：几乎占满屏幕 */
    mon.style.width = W1 + "px"; mon.style.marginLeft = (-W1 / 2) + "px";
    var hb = head.offsetTop + head.offsetHeight + Math.max(64, vh * 0.09);
    var standH = 0.06 * 0.14 * W1 + 12;
    var fit = (vh - hb - 36) / (SCREEN + standH / W1);           /* 起点：标志下方剩余空间能放下的宽度 */
    W0 = Math.max(Math.min(fit, vw * 0.62), Math.min(vw * 0.5, W1));
    var H0 = W0 * (SCREEN + 0.06 * 0.14) + 12;
    y0 = hb + Math.max(0, (vh - hb - H0) * 0.3); y1 = (vh - SCREEN * W1) / 2;
    update();
    mon.classList.add("ready");
  }
  function update() {
    ticking = false;
    var vh = window.innerHeight, total = pin.offsetHeight - vh;
    var p = reduce ? 0 : Math.min(1, Math.max(0, -pin.getBoundingClientRect().top / (total * 0.8)));
    var e = ease(p), s = (W0 + (W1 - W0) * e) / W1, y = y0 + (y1 - y0) * e;
    mon.style.transform = "translate3d(0," + y.toFixed(1) + "px,0) scale(" + s.toFixed(4) + ")";
    head.style.opacity = Math.max(0, 1 - p * 2.2).toFixed(3);
    head.style.transform = "translate3d(0," + (-p * 90).toFixed(1) + "px,0)";
    /* 淡出后的 logo 不再挡住下面的显示器：鼠标和触摸直接落到桌面上 */
    head.style.pointerEvents = p > 0.02 ? "none" : "";
    head.style.visibility = p > 0.5 ? "hidden" : "";
    stand.style.opacity = Math.max(0, 1 - p * 3).toFixed(3);
    cue.style.opacity = p > .02 ? 0 : 1; cue.style.pointerEvents = p > .02 ? "none" : "";
  }
  function req() { if (!ticking) { ticking = true; requestAnimationFrame(update); } }
  window.addEventListener("scroll", req, { passive: true });
  window.addEventListener("resize", layout);
  if (document.readyState === "complete") layout(); else window.addEventListener("load", layout);
  layout();
})();
</script>
